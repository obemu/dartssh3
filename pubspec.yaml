name: dartssh3
version: 3.0.2
description: SSH and SFTP client written in pure Dart, aiming to be feature-rich as well as easy to use.
homepage: https://github.com/obemu/dartssh3

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  asn1lib: ^1.0.0
  convert: ^3.0.0
  meta: ^1.1.6
  pointycastle: ^3.0.0
  pinenacl: ">=0.5.0 <1.0.0"

dev_dependencies:
  build_runner: ^2.4.12
  dart_code_metrics_presets: ^2.15.0
  lints: ">=4.0.0 <6.0.0"
  test: ^1.25.8

false_secrets:
  - test
